[server]
maxUploadSize = 60          # MB; a 6-minute 320 kbps mp3 is ~14 MB, a wav ~64 MB
headless = true

[browser]
gatherUsageStats = false

# Café at dusk. The same six colours are declared in streamlit_app.py's THEME_CSS;
# this file is what Streamlit's own widgets read, that sheet is everything else.
[theme]
base = "light"
primaryColor = "#B06E2C"              # caramel: the one action, the bars
backgroundColor = "#E9D5B8"           # linen: the room (the CSS paints a glow over it)
secondaryBackgroundColor = "#F6EBD9"  # oat: paper the widgets sit on
textColor = "#2C1B12"                 # espresso
linkColor = "#8C4A1E"
borderColor = "#D4B894"
font = "Figtree, sans-serif"
headingFont = "Fraunces, serif"
baseRadius = "14px"
buttonRadius = "12px"
showWidgetBorder = true
